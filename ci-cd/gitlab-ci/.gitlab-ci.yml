# GitLab CI/CD Pipeline Configuration for Voice Assistant ASR

stages:
  - setup
  - code-quality
  - unit-tests
  - integration-tests
  - e2e-tests
  - security
  - build
  - performance
  - release

variables:
  PYTHON_VERSION: "3.10"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_IMAGE: "voice-assistant:$CI_COMMIT_SHORT_SHA"
  DOCKER_LATEST: "voice-assistant:latest"

# Cache configuration
cache:
  paths:
    - .cache/pip
    - venv/

# ============================================================================
# SETUP STAGE: Install dependencies
# ============================================================================
setup:python:
  stage: setup
  image: python:${PYTHON_VERSION}
  script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements/base.txt
    - pip install -r requirements/dev.txt
    - pip install -r requirements/test.txt
  artifacts:
    paths:
      - venv/
    expire_in: 1 hour
  only:
    - merge_requests
    - main
    - develop

# ============================================================================
# CODE QUALITY STAGE
# ============================================================================
pylint:
  stage: code-quality
  image: python:${PYTHON_VERSION}
  needs: ["setup:python"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements/dev.txt
  script:
    - pylint src/voice_assistant --fail-under=7.0 --exit-zero || true
  artifacts:
    reports:
      codequality: pylint-report.json
    expire_in: 1 week
  allow_failure: true

black:
  stage: code-quality
  image: python:${PYTHON_VERSION}
  needs: ["setup:python"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install black
  script:
    - black --check src/ tests/ || true
  allow_failure: true

flake8:
  stage: code-quality
  image: python:${PYTHON_VERSION}
  needs: ["setup:python"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install flake8
  script:
    - flake8 src/ tests/ --max-line-length=100 --exit-zero
  allow_failure: true

mypy:
  stage: code-quality
  image: python:${PYTHON_VERSION}
  needs: ["setup:python"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install mypy
  script:
    - mypy src/voice_assistant --ignore-missing-imports --exit-zero
  allow_failure: true

pydocstyle:
  stage: code-quality
  image: python:${PYTHON_VERSION}
  needs: ["setup:python"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install pydocstyle
  script:
    - pydocstyle src/voice_assistant || true
  allow_failure: true

# ============================================================================
# UNIT TESTS STAGE
# ============================================================================
unit:tests:
  stage: unit-tests
  image: python:${PYTHON_VERSION}
  needs: ["pylint", "black", "flake8"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements/base.txt
    - pip install -r requirements/test.txt
  script:
    - pytest tests/unit/ -v --cov=src/voice_assistant --cov-report=xml --cov-report=html --junitxml=junit.xml
  artifacts:
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ============================================================================
# INTEGRATION TESTS STAGE
# ============================================================================
integration:tests:
  stage: integration-tests
  image: python:${PYTHON_VERSION}
  needs: ["unit:tests"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements/base.txt
    - pip install -r requirements/test.txt
  script:
    - pytest tests/integration/ -v --tb=short --junitxml=integration-junit.xml
  artifacts:
    reports:
      junit: integration-junit.xml
    expire_in: 1 week
  allow_failure: true

# ============================================================================
# E2E TESTS STAGE
# ============================================================================
e2e:tests:
  stage: e2e-tests
  image: python:${PYTHON_VERSION}
  needs: ["integration:tests"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements/base.txt
    - pip install -r requirements/test.txt
  script:
    - pytest tests/e2e/ -v --tb=short --junitxml=e2e-junit.xml
  artifacts:
    reports:
      junit: e2e-junit.xml
    expire_in: 1 week
  allow_failure: true

# ============================================================================
# SECURITY STAGE
# ============================================================================
security:bandit:
  stage: security
  image: python:${PYTHON_VERSION}
  needs: ["pylint"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install bandit
  script:
    - bandit -r src/voice_assistant -f json -o bandit-report.json || true
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 1 week
  allow_failure: true

security:safety:
  stage: security
  image: python:${PYTHON_VERSION}
  needs: ["setup:python"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements/base.txt
    - pip install safety
  script:
    - safety check --json || true
  allow_failure: true

security:pip-audit:
  stage: security
  image: python:${PYTHON_VERSION}
  needs: ["setup:python"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements/base.txt
    - pip install pip-audit
  script:
    - pip-audit --desc || true
  allow_failure: true

# ============================================================================
# BUILD STAGE
# ============================================================================
build:docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  needs: ["unit:tests", "security:bandit"]
  script:
    - docker build -f docker/Dockerfile -t $DOCKER_IMAGE -t $DOCKER_LATEST .
    - docker save $DOCKER_IMAGE -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day
  only:
    - main
    - develop
    - /^v\d+\.\d+\.\d+$/

build:wheel:
  stage: build
  image: python:${PYTHON_VERSION}
  needs: ["unit:tests"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install build wheel twine
  script:
    - python -m build
    - twine check dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - tags

# ============================================================================
# PERFORMANCE TESTS STAGE
# ============================================================================
performance:tests:
  stage: performance
  image: python:${PYTHON_VERSION}
  needs: ["unit:tests"]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements/base.txt
    - pip install -r requirements/test.txt
  script:
    - pytest tests/performance/ -v --tb=short --junitxml=performance-junit.xml
  artifacts:
    reports:
      junit: performance-junit.xml
    expire_in: 1 week
  allow_failure: true
  only:
    - main
    - develop
    - schedules

# ============================================================================
# RELEASE STAGE
# ============================================================================
release:
  stage: release
  image: python:${PYTHON_VERSION}
  needs: ["build:wheel", "build:docker"]
  before_script:
    - apt-get update && apt-get install -y curl
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install twine
  script:
    - echo "Publishing release artifacts"
    - echo "Version: $CI_COMMIT_TAG"
    - echo "Distribution files ready in dist/"
  artifacts:
    paths:
      - dist/
    expire_in: 1 month
  only:
    - tags
  allow_failure: true

# ============================================================================
# PIPELINE SUCCESS NOTIFICATION
# ============================================================================
.notify_template: &notify_template
  image: alpine:latest
  before_script:
    - apk add --no-cache curl

success:notification:
  <<: *notify_template
  stage: release
  script:
    - echo "CI/CD Pipeline completed successfully"
  when: on_success
  only:
    - main
    - develop

failure:notification:
  <<: *notify_template
  stage: release
  script:
    - echo "CI/CD Pipeline failed. Check logs for details."
  when: on_failure
