name: Code Quality Checks

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  linting:
    name: Linting & Format Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort mypy pydocstyle
      
      - name: Run Pylint
        run: |
          pylint src/voice_assistant --exit-zero
        continue-on-error: true
      
      - name: Run Flake8
        run: |
          flake8 src/ tests/ --max-line-length=100 --exit-zero
        continue-on-error: true
      
      - name: Check code formatting (Black)
        run: |
          black --check src/ tests/ --exit-zero
        continue-on-error: true
      
      - name: Check import sorting (isort)
        run: |
          isort --check-only src/ tests/ --exit-zero
        continue-on-error: true
      
      - name: Type checking (mypy)
        run: |
          mypy src/voice_assistant --ignore-missing-imports --exit-zero
        continue-on-error: true
      
      - name: Check docstrings (pydocstyle)
        run: |
          pydocstyle src/voice_assistant --exit-zero
        continue-on-error: true

  complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install complexity tools
        run: |
          python -m pip install --upgrade pip
          pip install radon
      
      - name: Run Radon for cyclomatic complexity
        run: |
          radon cc src/voice_assistant -a -j > cc-report.json || true
      
      - name: Run Radon for maintainability index
        run: |
          radon mi src/voice_assistant -j > mi-report.json || true
      
      - name: Check complexity thresholds
        run: |
          radon cc src/voice_assistant -s -f -a
        continue-on-error: true
      
      - name: Upload complexity reports
        uses: actions/upload-artifact@v3
        with:
          name: complexity-reports
          path: |
            cc-report.json
            mi-report.json
        continue-on-error: true

  security-lint:
    name: Security Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      

