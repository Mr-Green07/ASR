name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test-before-release:
    name: Pre-Release Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/test.txt
      
      - name: Run all tests
        run: |
          pytest tests/ -v --tb=short
      
      - name: Check version consistency
        run: |
          python -c "
          import re
          with open('VERSION') as f:
              version = f.read().strip()
          with open('setup.py') as f:
              setup_content = f.read()
          if f'version=\"{version}\"' not in setup_content:
              print(f'Version mismatch: VERSION file has {version}')
              exit(1)
          "

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: test-before-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine
      
      - name: Build distribution
        run: |
          python -m build
      
      - name: Check distribution
        run: |
          twine check dist/*
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: distribution
          path: dist/

  build-docker-release:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test-before-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: secrets.DOCKER_USERNAME != ''
      
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            voice-assistant:latest
            voice-assistant:${{ steps.extract_version.outputs.version }}
        if: secrets.DOCKER_USERNAME != ''
      
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: |
            voice-assistant:${{ steps.extract_version.outputs.version }}
        if: secrets.DOCKER_USERNAME == ''

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-artifacts, build-docker-release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: distribution
          path: dist/
      
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release Notes
        id: release_notes
        run: |
          python -c "
          import os
          changelog = ''
          try:
              with open('CHANGELOG.md') as f:
                  content = f.read()
              # Extract notes for current version
              version = '${{ steps.extract_version.outputs.version }}'
              sections = content.split(f'## [{version}]')
              if len(sections) > 1:
                  changelog = sections[1].split('## [')[0].strip()
          except:
              pass
          if not changelog:
              changelog = 'See CHANGELOG.md for details'
          with open('release_notes.txt', 'w') as f:
              f.write(changelog)
          "
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.extract_version.outputs.version }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
      
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: publish-release
    if: always()
    
    steps:
      - name: Release notification
        run: |
          echo "Release published successfully!"
          echo "Version: ${{ github.ref_name }}"
          echo "Artifacts available in GitHub release page"
