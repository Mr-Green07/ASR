name: Security Scanning

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 2 * * 0'  # Run weekly on Sunday at 2 AM UTC

jobs:
  security-analysis:
    name: Security & Dependency Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt
          pip install safety bandit pip-audit
      
      - name: Run Bandit for security issues
        run: |
          bandit -r src/voice_assistant -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Run Safety for known vulnerabilities
        run: |
          safety check --json
        continue-on-error: true
      
      - name: Run pip-audit for dependency vulnerabilities
        run: |
          pip-audit --desc
        continue-on-error: true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-security-report
          path: bandit-report.json
        continue-on-error: true

  dependency-check:
    name: Dependency License Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install pip-licenses
      
      - name: Generate license report
        run: |
          pip-licenses --format=json --output-file=licenses.json
      
      - name: Check for problematic licenses
        run: |
          python -c "
          import json
          with open('licenses.json') as f:
              licenses = json.load(f)
          problematic = ['GPL', 'AGPL', 'SSPL']
          issues = [pkg for pkg in licenses if any(lic in pkg.get('License', '') for lic in problematic)]
          if issues:
              print('Warning: Potentially problematic licenses found:')
              for issue in issues:
                  print(f'  {issue}')
          "
        continue-on-error: true
      
      - name: Upload license report
        uses: actions/upload-artifact@v3
        with:
          name: license-report
          path: licenses.json
        continue-on-error: true
